<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Draft Assistant mark: a football on the diagonal. Amber is the app's
       accent colour (#ffb454); the laces are cut in the page canvas colour
       (#0a0b0e) so the mark still reads as a football at 16px, where a stroked
       outline would fill in. Token names are spelled out here rather than
       written as CSS custom properties: a double hyphen is illegal inside an
       XML comment and silently kills the whole file. -->
  <path fill="#ffb454" d="M20 4A13 13 0 0 1 4 20 13 13 0 0 1 20 4Z"/>
  <g stroke="#0a0b0e" stroke-width="1.5" stroke-linecap="round">
    <path d="M14.6 9.4 9.4 14.6"/>
    <path d="M12.8 8.8 15.2 11.2"/>
    <path d="M10.8 10.8 13.2 13.2"/>
    <path d="M8.8 12.8 11.2 15.2"/>
  </g>
</svg>
