<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{
    --field:#0c1524; --edge:#1b2b45; --chalk:#f2f6fc; --chalk-2:#9fb2ce;
    --chalk-3:#5d7093; --gold:#ffb020; --go:#3fd189; --bad:#e8503c;
    --sans:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  body{
    width:300px; margin:0; padding:16px; background:var(--field);
    color:var(--chalk); font-family:var(--sans); -webkit-font-smoothing:antialiased;
  }
  h1{font-size:12px; letter-spacing:.14em; text-transform:uppercase;
     color:var(--chalk-3); margin:0 0 4px;}
  p{font-size:12.5px; color:var(--chalk-2); line-height:1.5; margin:0 0 14px;}
  button{
    width:100%; font:600 14px/1 var(--sans); color:#23180a; background:var(--gold);
    border:0; border-radius:6px; padding:12px; cursor:pointer;
  }
  button:hover{background:#ffc247;}
  button:disabled{background:#2a3039; color:var(--chalk-3); cursor:default;}
  .msg{margin-top:13px; font:500 12px/1.5 var(--mono); min-height:18px;}
  .ok{color:var(--go);} .err{color:var(--bad);}
  .fine{margin-top:14px; font-size:10.5px; color:var(--chalk-3); line-height:1.5;}
</style>
</head>
<body>
  <h1>⚓ Draft Helper</h1>
  <p>On your ESPN draft tab, click below. Your board syncs — no login, no
     password, just this draft.</p>
  <button id="sync">Sync this draft</button>
  <div class="msg" id="msg"></div>
  <div class="fine">Sends only a token specific to this draft. Your ESPN
     password and account cookie never leave your browser.</div>
  <script src="popup.js"></script>
</body>
</html>
